backend:
  name: turbo-github
  turbo_site_id: YOUR_DECAP_TURBO_SITE_ID
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "posts"
    label: "Articles"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "/posts/{{slug}}/"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss"

      - label: "Categories"
        name: "categories"
        widget: "list"
        default: ["Cybersecurity"]

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Body"
        name: "body"
        widget: "markdown"
